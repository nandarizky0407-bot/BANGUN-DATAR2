<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploring 2D Shapes • Grade 5 Cambridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;color:#2E2A47;background:#FFF7EA;overflow:hidden;font-size:16px}
h1,h2,h3{font-family:'Fredoka','Nunito','Comic Sans MS',sans-serif;font-weight:600}
button{font-family:inherit}
.hidden{display:none!important}
.tiny{font-size:.8rem;color:#7A7590;font-weight:700}
.lead{font-weight:700;color:#5B5570;margin:6px 0 14px}
h2{font-size:2rem;margin-bottom:6px}
/* ---------- top / nav ---------- */
#pbar{position:fixed;top:0;left:0;height:6px;width:0;background:linear-gradient(90deg,#FFB347,#FF5C8A,#7C6CFF);z-index:60;transition:width .35s;border-radius:0 4px 4px 0}
#brand{position:fixed;top:12px;left:14px;z-index:55;background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;box-shadow:0 4px 14px rgba(80,60,140,.15);font-size:.82rem}
#topbar{position:fixed;top:12px;right:14px;z-index:55;display:flex;gap:8px}
.tbtn{width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 14px rgba(80,60,140,.18);font-size:1.05rem;cursor:pointer;transition:.15s}
.tbtn:hover{transform:translateY(-2px)}
#langBtn{width:auto;border-radius:999px;padding:0 14px;font-weight:800;font-size:.85rem}
#nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);padding:8px 12px;border-radius:999px;box-shadow:0 8px 24px rgba(80,60,140,.22)}
.nbtn{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,#FF8A5C,#FF5C8A);color:#fff;font-size:1.1rem;cursor:pointer;transition:.15s;font-weight:900}
.nbtn:hover{transform:scale(1.08)}
#slideNum{font-weight:900;min-width:64px;text-align:center;font-size:.95rem}
/* ---------- slides ---------- */
.slide{position:fixed;inset:0;overflow-y:auto;display:none;padding:74px 18px 100px}
.slide.active{display:block;animation:slideIn .5s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.inner{max-width:1120px;margin:0 auto}
.bg-cover{background:linear-gradient(135deg,#FFE29F 0%,#FFA99F 45%,#FF719A 100%)}
.bg-obj{background:linear-gradient(135deg,#FFF3D6,#FFE0C7)}
.bg-explore{background:linear-gradient(135deg,#E0F4FF,#F1E8FF)}
.bg-shape{background:#FFFDF6;background:linear-gradient(140deg,color-mix(in srgb,var(--sc) 16%,#fff),#FFFDF6 70%)}
.bg-riddle{background:linear-gradient(135deg,#DFF7EC,#CFF3FF)}
.bg-quiz{background:linear-gradient(135deg,#FFF0F3,#F3E8FF)}
.bg-memory{background:linear-gradient(135deg,#E4EDFF,#E0FFF4)}
.bg-concl{background:linear-gradient(135deg,#FFF6D9,#FFEBF1)}
.bg-refl{background:linear-gradient(135deg,#EFE9FF,#FFE9F3)}
.bg-thanks{background:linear-gradient(135deg,#FFD9C2,#FFC2D9,#D9C2FF)}
/* ---------- buttons / cards ---------- */
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:.15s;display:inline-flex;gap:8px;align-items:center;justify-content:center;color:#2E2A47}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn-p{background:linear-gradient(135deg,#FF8A5C,#FF5C8A);color:#fff}
.btn-s{background:#fff;border:2px solid #E8E0F5}
.btn-t{background:linear-gradient(135deg,#5CC9FF,#7C6CFF);color:#fff}
.btn.sm{padding:8px 14px;font-size:.82rem;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.big{font-size:1.15rem;padding:14px 28px}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.card{background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 8px 22px rgba(80,60,140,.1);margin-top:14px}
.card h3{font-size:1.05rem;margin-bottom:4px}
/* ---------- cover ---------- */
.cover{text-align:center;position:relative}
.floats span{position:absolute;font-size:2.6rem;opacity:.75;animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-18px) rotate(5deg)}}
.cover-card{background:rgba(255,255,255,.94);border-radius:32px;padding:38px 26px;max-width:680px;margin:4vh auto 0;box-shadow:0 20px 50px rgba(150,60,90,.3);position:relative}
.cover-emoji{font-size:2.6rem;letter-spacing:6px}
.cover-card h1{font-size:2.5rem;line-height:1.15;margin:10px 0;color:#2E2A47}
.cover-card h1 b{color:#FF5C8A}
.sub{font-size:1.05rem;font-weight:700;color:#6B6584}
.grade-chip{display:inline-block;background:#FFF3D6;border:2px solid #FFD66B;color:#8A6100;border-radius:999px;padding:8px 18px;font-weight:800;margin:14px 0 18px}
.hint-row{margin-top:14px;font-size:.82rem;color:#8A84A0;font-weight:700}
/* ---------- objectives ---------- */
.obj-list{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:920px}
.obj-list li{background:#fff;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:800;box-shadow:0 6px 16px rgba(120,80,60,.12);font-size:.97rem}
.obj-ico{font-size:1.6rem}
.cam-chip{display:inline-block;margin-top:16px;background:#E8F4FF;border:2px solid #7CC4FF;color:#0B5394;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.85rem}
/* ---------- explore grid ---------- */
.exp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.exp-card{background:#fff;border:3px solid var(--sc);border-radius:22px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:.18s}
.exp-card:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 14px 28px rgba(80,60,140,.2)}
.exp-card svg{width:74px;height:74px}
.exp-card b{font-size:1.02rem;color:#2E2A47}
.exp-sub{font-size:.72rem;color:#7A7590;font-weight:800}
/* ---------- shape slides ---------- */
.shp-head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.shp-emoji{font-size:3rem;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15));animation:floaty 4s ease-in-out infinite}
.tagline{font-weight:800;color:#7A7590}
.shape-layout{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:10px}
.stage-wrap{max-width:540px;margin:0 auto;width:100%}
.stage{position:relative;aspect-ratio:1/1;background:radial-gradient(circle at 30% 20%,#fff,#FBF8FF);border-radius:26px;box-shadow:0 10px 26px rgba(80,60,140,.14);overflow:hidden}
.stage .shape-svg{width:100%;height:100%;display:block;transition:transform .9s cubic-bezier(.5,0,.3,1.2)}
.stage.folding .shape-svg{opacity:.18}
.stage.wiggle .shape-svg{animation:wig .45s ease-in-out 2}
@keyframes wig{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-10px) rotate(-2deg)}75%{transform:translateX(10px) rotate(2deg)}}
.stage-msg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#2E2A47;color:#fff;border-radius:999px;padding:9px 18px;font-weight:800;font-size:.88rem;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:5;animation:pop .3s}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.count-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center;align-items:center}
.chip-btn{background:#fff;border:2px dashed var(--sc,#999);border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:.8rem;color:#4a4560;transition:.15s}
.chip-btn:hover{transform:translateY(-2px)}
.count-chip{background:#FFF3C9;border:2px solid #F5C518;border-radius:999px;padding:8px 12px;font-weight:800;font-size:.8rem;color:#7A5B00}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:3px solid var(--sc);border-radius:18px;padding:10px 6px;text-align:center;cursor:pointer;transition:.15s}
.stat:hover{transform:translateY(-3px)}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:2rem;color:var(--sc)}
.stat span{font-size:.78rem;font-weight:800;color:#6B6584}
.props{list-style:none;display:grid;gap:8px;margin-top:8px}
.props li{background:#F8F6FF;border-radius:12px;padding:9px 12px 9px 38px;position:relative;font-weight:600;font-size:.93rem}
.props li:before{content:"✔";position:absolute;left:12px;top:8px;color:var(--sc);font-weight:900}
.sym-facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.fact{background:#E9FBF1;border:2px solid #34D399;border-radius:12px;padding:8px 12px;font-weight:800;font-size:.88rem;color:#065F46}
.ex-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.ex{background:#fff;border:2px solid #EFEAF8;border-radius:16px;padding:10px 6px;text-align:center;transition:.15s;cursor:pointer}
.ex:hover{transform:translateY(-4px) scale(1.03);border-color:var(--sc)}
.ex-emo{font-size:1.9rem;display:block}
.ex-lab{font-size:.73rem;font-weight:800;color:#5B5570;display:block;margin-top:4px}
.tip-row{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.tip-row.center{justify-content:center;align-items:center}
.mascot{font-size:2.2rem;animation:floaty 3s ease-in-out infinite}
.bubble{background:#fff;border-radius:16px;padding:10px 14px;font-weight:600;font-size:.92rem;box-shadow:0 6px 16px rgba(80,60,140,.12);position:relative;max-width:660px}
.bubble:before{content:"";position:absolute;left:-8px;top:14px;border:8px solid transparent;border-right-color:#fff}
/* ---------- svg internals ---------- */
.g-diag,.g-sym{opacity:0;transition:.4s}
.show-diag .g-diag{opacity:1}
.show-sym .g-sym{opacity:1}
.g-radius{opacity:0;transition:.4s}
.show-radius .g-radius{opacity:1}
.g-verts .vwrap{cursor:pointer}
.g-verts circle{transition:.2s}
.g-verts .vwrap.counted circle{fill:#FFD54F;stroke:#F59E0B}
.cnt{opacity:0;font:800 15px 'Fredoka',sans-serif;fill:#7C3AED;transition:.2s}
.cnt.s{fill:#E11D48}
.counted .cnt{opacity:1}
.g-sidehits line{stroke:transparent;stroke-width:18;cursor:pointer;transition:stroke .2s;pointer-events:stroke}
.g-sidehits .swrap.counted line{stroke:#F43F5E;stroke-opacity:.45;stroke-width:12}
.circ circle{fill:transparent;stroke:transparent;stroke-width:20;cursor:pointer;pointer-events:stroke}
.circ.counted circle{stroke:#F43F5E;stroke-opacity:.35}
.cvert{cursor:pointer}
.shape-svg.mini *{pointer-events:none}
/* ---------- fold layer ---------- */
.fold-layer{position:absolute;inset:0;pointer-events:none;perspective:900px;opacity:0;transition:opacity .25s;z-index:3}
.fold-layer.folded{opacity:1}
.fold-layer .half{position:absolute;inset:0;width:100%;height:100%}
.hl{clip-path:inset(-2% 50% -2% -2%)}
.hr{clip-path:inset(-2% -2% -2% 50%);transform-origin:0 50%;transition:transform 1.5s cubic-bezier(.55,0,.45,1)}
.fold-layer.folded .hr{transform:rotateY(-178deg)}
.fold-layer:before{content:"";position:absolute;left:calc(50% - 3px);top:3%;bottom:3%;width:5px;border-radius:5px;background:repeating-linear-gradient(180deg,#F59E0B 0 14px,rgba(0,0,0,0) 14px 26px);opacity:0;transition:.25s;z-index:4}
.fold-layer.folded:before{opacity:1}
/* ---------- games shared ---------- */
.game-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip{background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:0 3px 10px rgba(80,60,140,.12);font-size:.85rem}
.riddle-card{padding:22px;margin:8px 0}
.riddle-card p{font-size:1.3rem;font-weight:800;font-family:'Fredoka',sans-serif;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:10px 0}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #E8E2F7;border-radius:18px;padding:14px 16px;font-size:1.05rem;font-weight:800;cursor:pointer;transition:.15s;color:#2E2A47;text-align:left}
.opt:hover:not(:disabled){transform:translateY(-3px);border-color:#B9A7F5}
.opt .opt-emo{font-size:1.8rem}
.opt.ok{background:#E7F9EE;border-color:#2ECC71}
.opt.no{background:#FDECEC;border-color:#F26D6D;animation:shake .4s}
.opt.dim{opacity:.55}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:52px;margin:6px 0}
.fb-box{border-radius:16px;padding:12px 16px;font-weight:700;animation:pop .3s}
.fb-box.good{background:#E7F9EE;border:2px solid #2ECC71}
.fb-box.bad{background:#FDECEC;border:2px solid #F26D6D}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.game-nav{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.results{text-align:center;background:#fff;border-radius:24px;padding:28px;box-shadow:0 10px 30px rgba(80,60,140,.15);animation:pop .4s}
.big-score{font-family:'Fredoka',sans-serif;font-size:3.4rem;color:#FF5C8A;line-height:1.1}
.stars{font-size:1.9rem;letter-spacing:4px;margin:6px 0}
/* ---------- memory ---------- */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:600px;margin:14px auto}
.mem-card{aspect-ratio:3/3.4;background:none;border:0;padding:0;cursor:pointer;perspective:700px}
.mem-in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mem-card.flip .mem-in{transform:rotateY(180deg)}
.mf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.mb{background:linear-gradient(135deg,#7C6CFF,#5CC9FF);color:#fff;font-size:1.7rem;font-family:'Fredoka',sans-serif;box-shadow:0 6px 14px rgba(80,60,140,.25)}
.mf-front{background:#fff;border:3px solid var(--sc,#ccc);transform:rotateY(180deg);padding:6px}
.mf-front svg{width:70%;height:62%}
.mn-emo{font-size:2.2rem}
.mf-front b{font-size:.95rem;color:var(--sc);text-align:center;line-height:1.2}
.mem-card.match .mf-front{outline:3px solid #2ECC71;background:#F2FDF6}
.mem-card.match{animation:pop .35s}
/* ---------- conclusion ---------- */
.tbl-wrap{overflow-x:auto;margin-top:10px}
table.recap{border-collapse:collapse;width:100%;min-width:640px}
.recap th{background:#7C6CFF;color:#fff;padding:10px 8px;font-size:.85rem}
.recap td{border-bottom:2px solid #F1EDFA;padding:8px;font-weight:700;font-size:.9rem;text-align:center}
.recap tbody tr{cursor:pointer;transition:.15s}
.recap tbody tr:hover{background:#FFF3D6}
.rc-shape{display:flex;align-items:center;gap:8px;text-align:left}
.mini-svg{width:34px;height:34px;display:inline-block;flex:none}
.mini-svg svg{width:100%;height:100%}
.vocab{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.vcard{background:#F6F3FF;border:2px solid #E2D9FF;border-radius:16px;padding:12px;cursor:pointer;text-align:left;font-weight:800;color:#4C3FA3;transition:.15s;font-size:.9rem}
.vcard:hover{border-color:#7C6CFF}
.vcard .vdef{display:block;max-height:0;overflow:hidden;transition:max-height .35s,margin .35s;font-weight:600;color:#55506E;font-size:.82rem}
.vcard.open .vdef{max-height:140px;margin-top:6px}
/* ---------- reflection ---------- */
.mood-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.mood{background:#fff;border:3px solid #EFE7FF;border-radius:18px;padding:12px 18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;color:#4A4460}
.mood span{font-size:2rem}
.mood:hover{transform:translateY(-4px)}
.mood.sel{border-color:#FF5C8A;background:#FFF0F5}
.mood-msg{margin-top:10px;font-weight:700;color:#C2255C;animation:pop .3s}
.checks{display:grid;gap:8px;margin-top:10px}
.check{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #EFE7FF;border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:700;color:#3F3A55;text-align:left;font-size:.95rem}
.check.on{border-color:#2ECC71;background:#F2FDF6}
.cb{font-size:1.1rem}
.pbar-mini{height:12px;background:#EFEAF8;border-radius:99px;overflow:hidden;margin-top:10px}
.pbar-mini div{height:100%;background:linear-gradient(90deg,#FFB347,#FF5C8A);transition:width .4s;border-radius:99px}
textarea{width:100%;border:2px solid #E2D9FF;border-radius:14px;padding:12px;font-family:inherit;font-weight:600;font-size:.95rem;margin-top:10px;resize:vertical}
.scores{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.score-chip{border:2px solid #FFD54F;background:#FFFCF0;border-radius:14px;padding:10px 14px;font-weight:800;font-size:.9rem}
/* ---------- thanks ---------- */
.thanks{text-align:center}
.thanks-card{background:rgba(255,255,255,.92);border-radius:28px;padding:36px 24px;box-shadow:0 16px 40px rgba(120,60,120,.25);max-width:640px;margin:0 auto}
.credit{margin-top:16px;font-size:.8rem;color:#8A84A0;font-weight:700}
/* ---------- menu overlay ---------- */
#menuOv{position:fixed;inset:0;background:rgba(40,28,70,.6);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
#menuOv.hidden{display:none}
.menu-panel{background:#FFFDF7;border-radius:24px;padding:20px;max-width:780px;width:100%;max-height:84vh;overflow:auto}
.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m-item{display:flex;align-items:center;gap:8px;background:#F6F3FF;border:2px solid #E9E1FF;border-radius:14px;padding:10px 12px;font-weight:800;color:#3F3A55;cursor:pointer;font-size:.85rem;text-align:left}
.m-item:hover{border-color:#7C6CFF;background:#EFEBFF}
.m-item .mi{font-size:1.2rem}
/* ---------- confetti ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.cf{position:absolute;top:-20px;border-radius:3px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(108vh) rotate(720deg)}}
/* ---------- responsive ---------- */
@media(max-width:920px){.shape-layout{grid-template-columns:1fr}.exp-grid{grid-template-columns:repeat(3,1fr)}.obj-list{grid-template-columns:1fr}.vocab{grid-template-columns:repeat(2,1fr)}#menuGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.exp-grid{grid-template-columns:repeat(2,1fr)}.opts{grid-template-columns:1fr}.ex-row{grid-template-columns:repeat(2,1fr)}.mem-grid{gap:8px}.cover-card h1{font-size:1.8rem}h2{font-size:1.5rem}.stat b{font-size:1.5rem}.riddle-card p{font-size:1.12rem}.vocab{grid-template-columns:1fr}#brand{display:none}}
</style>
</head>
<body>
<div id="pbar"></div>
<div id="brand">🔺 Grade 5 • 2D Shapes</div>
<div id="topbar">
 <button id="langBtn" class="tbtn" onclick="setLang(LANG==='en'?'id':'en')">🌐 English</button>
 <button id="sndBtn" class="tbtn" onclick="toggleSound()" title="Sound">🔊</button>
 <button class="tbtn" onclick="toggleFS()" title="Fullscreen">⛶</button>
 <button class="tbtn" onclick="toggleMenu()" title="Menu">☰</button>
</div>

<!-- ============ 1. COVER ============ -->
<section class="slide bg-cover" data-icon="🏠" data-title-en="Cover" data-title-id="Sampul">
 <div class="inner cover">
  <div class="floats">
   <span style="left:6%;top:12%;animation-delay:0s">🔺</span>
   <span style="left:14%;top:68%;animation-delay:.7s">🔵</span>
   <span style="left:85%;top:16%;animation-delay:1.2s">⬛</span>
   <span style="left:78%;top:70%;animation-delay:.4s">🔶</span>
   <span style="left:45%;top:8%;animation-delay:1.6s">🪁</span>
   <span style="left:60%;top:82%;animation-delay:.9s">⏢</span>
   <span style="left:26%;top:22%;animation-delay:1.9s">▭</span>
   <span style="left:72%;top:40%;animation-delay:2.2s">▱</span>
  </div>
  <div class="cover-card">

function t(o){return !o?"":(LANG==="en"?o.en:o.id)}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const byId={};SHAPES.forEach(s=>byId[s.id]=s);
function starStr(n){n=Math.max(0,Math.min(5,n));let s="";for(let i=0;i<5;i++)s+=i<n?"⭐":"☆";return s}

function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function factLine(s){const sid=LANG==="en"?(s.sides===1?"side":"sides"):"sisi";const vid=LANG==="en"?(s.verts===1?"vertex":"vertices"):"titik sudut";const lid=(LANG==="en"&&s.symN!=="∞"&&s.symN!=="1")?"lines of symmetry":(LANG==="en"?"line of symmetry":"sumbu simetri");return "✅ <b>"+t(s.name)+"</b> — "+s.sides+" "+sid+" • "+s.verts+" "+vid+" • "+s.diags+" "+(LANG==="en"?"diagonals":"diagonal")+" • ✂️ "+s.symN+" "+lid}

/* ============ AUDIO ============ */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,ty,vol,when){const c=ac();if(!c||MUTED)return;const o=c.createOscillator(),g=c.createGain();o.type=ty||"sine";o.frequency.value=f;g.gain.value=vol||.15;o.connect(g);g.connect(c.destination);const t0=c.currentTime+(when||0);o.start(t0);g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.stop(t0+d)}
function sfx(k){if(k==="ok"){tone(523,.12);tone(659,.12,"sine",.15,.09);tone(784,.22,"sine",.15,.18)}else if(k==="no"){tone(220,.2,"sawtooth",.07);tone(160,.3,"sawtooth",.07,.12)}else if(k==="flip"){tone(440,.06,"triangle",.1)}else if(k==="pop"){tone(600,.05,"triangle",.12)}else if(k==="fold"){tone(330,.1,"triangle",.1);tone(392,.14,"triangle",.1,.1)}else if(k==="win"){[523,659,784,1046].forEach((f,i)=>tone(f,.18,"sine",.16,i*.13))}}
function toggleSound(){MUTED=!MUTED;$("#sndBtn").textContent=MUTED?"🔇":"🔊";store("g5_mute",MUTED?"1":"0")}

function msg(sec,txt){const m=sec.querySelector("[data-msg]");if(!m)return;m.textContent=txt;m.classList.remove("hidden");clearTimeout(m._tm);m._tm=setTimeout(()=>m.classList.add("hidden"),2800)}

function updateChip(sec,s,kind){const chip=sec.querySelector(".count-chip."+kind);if(!chip)return;
 if(kind==="cv"){if(s.geo.circle){return}const n=sec.querySelectorAll(".g-verts .vwrap.counted").length;chip.textContent=U.corners[LANG]+": "+n+"/"+s.verts;if(n===s.verts){msg(sec,U.doneCorners[LANG]);sfx("ok");confetti(25)}}
 else{const n=sec.querySelectorAll(".swrap.counted").length;const tot=s.geo.circle?1:s.sides;chip.textContent=(s.geo.circle?U.curved[LANG]:U.sides[LANG])+": "+n+"/"+tot;if(n===tot){msg(sec,s.geo.circle?U.circleCurved[LANG]:U.doneSides[LANG]);sfx("ok");confetti(25)}}}

function autoCount(sec,s,kind){if(kind==="cv"){if(s.geo.circle){msg(sec,U.circleNoCorners[LANG]);sfx("pop");return}const wraps=sec.querySelectorAll(".g-verts .vwrap");wraps.forEach(w=>w.classList.remove("counted"));wraps.forEach((w,i)=>setTimeout(()=>{w.classList.add("counted");sfx("pop");updateChip(sec,s,"cv")},i*420))}
 else{let wraps;if(s.geo.circle){wraps=sec.querySelectorAll(".swrap.circ")}else{wraps=sec.querySelectorAll(".g-sidehits .swrap")}wraps.forEach(w=>w.classList.remove("counted"));wraps.forEach((w,i)=>setTimeout(()=>{w.classList.add("counted");sfx("pop");updateChip(sec,s,"cs");if(s.geo.circle)msg(sec,U.circleCurved[LANG])},i*450))}}

function playFold(sec,s){const stage=sec.querySelector("[data-stage]");
 if(!s.geo.sym||!s.geo.sym.length){stage.classList.add("wiggle");msg(sec,U.noSym[LANG]);sfx("no");setTimeout(()=>stage.classList.remove("wiggle"),1000);return}
 let fl=stage.querySelector(".fold-layer");
 if(!fl){fl=document.createElement("div");fl.className="fold-layer";fl.innerHTML='<svg viewBox="0 0 200 200" class="half hl">'+innerOnly(s)+'</svg><svg viewBox="0 0 200 200" class="half hr">'+innerOnly(s)+"</svg>";stage.appendChild(fl)}
 fl.classList.remove("folded");void fl.offsetWidth;stage.classList.add("folding");fl.classList.add("folded");sfx("fold");msg(sec,U.foldMatch[LANG]);
 setTimeout(()=>{fl.classList.remove("folded");setTimeout(()=>stage.classList.remove("folding"),600)},1700)}

function playSpin(sec,s){const svg=sec.querySelector(".shape-svg");if(!svg)return;
 let step;if(s.rot==="∞"){step=120}else{step=Math.round(360/parseInt(s.rot,10))}
 svg._rot=(svg._rot||0)+step;svg.style.transform="rotate("+svg._rot+"deg)";sfx("flip");
 if(s.rot==="∞")msg(sec,U.spinInf[LANG]);else if(s.rot==="1")msg(sec,U.spinFull[LANG]);else msg(sec,U.spinOk[LANG].replace("{o}",s.rot))}

function resetStage(sec,s){const svg=sec.querySelector(".shape-svg");svg.classList.remove("show-diag","show-sym","show-radius");svg.style.transform="none";svg._rot=0;
 sec.querySelectorAll(".vwrap.counted,.swrap.counted").forEach(w=>w.classList.remove("counted"));
 const cv=sec.querySelector(".count-chip.cv"),cs=sec.querySelector(".count-chip.cs");
 if(cv)cv.textContent=s.geo.circle?(U.corners[LANG]+": 0 😲"):(U.corners[LANG]+": 0/"+s.verts);
 if(cs)cs.textContent=s.geo.circle?(U.curved[LANG]+": 0/1"):(U.sides[LANG]+": 0/"+s.sides);
 const m=sec.querySelector("[data-msg]");if(m)m.classList.add("hidden")}

function bindShapeHost(){$("#shapeHost").addEventListener("click",e=>{
 const sec=e.target.closest(".slide");if(!sec||!sec.dataset.shape)return;const s=byId[sec.dataset.shape];if(!s)return;
 const vw=e.target.closest(".vwrap");
 if(vw&&!s.geo.circle){if(!vw.classList.contains("counted")){vw.classList.add("counted");sfx("pop");updateChip(sec,s,"cv")}return}
 if(vw&&s.geo.circle){const svg=sec.querySelector(".shape-svg");svg.classList.toggle("show-radius");msg(sec,U.radiusMsg[LANG]);sfx("pop");return}
 const sw=e.target.closest(".swrap");
 if(sw){if(!sw.classList.contains("counted")){sw.classList.add("counted");sfx("pop");if(s.geo.circle)msg(sec,U.circleCurved[LANG]);updateChip(sec,s,"cs")}return}
 const btn=e.target.closest("[data-act]");if(!btn)return;const act=btn.dataset.act;const svg=sec.querySelector(".shape-svg");
 if(act==="diag"){svg.classList.toggle("show-diag");if(!s.geo.diag.length)msg(sec,U.noDiag[LANG]);else if(svg.classList.contains("show-diag"))msg(sec,U.diagOn[LANG])}
 else if(act==="sym"){svg.classList.toggle("show-sym");if(svg.classList.contains("show-sym")){if(!s.geo.sym.length)msg(sec,U.noSym[LANG]);else msg(sec,U.symOn[LANG])}}
 else if(act==="fold"){playFold(sec,s)}
 else if(act==="spin"){playSpin(sec,s)}
 else if(act==="countv"){autoCount(sec,s,"cv")}
 else if(act==="counts"){autoCount(sec,s,"cs")}
 else if(act==="reset"){resetStage(sec,s)}
})}

 if(st.done){box.innerHTML=riddleResult();return}
 const ri=st.order[st.i];const r=RIDDLES[ri];const opts=st.perm[ri].map(k=>r.o[k]);const correct=r.o[r.a];const answered=st.ans[ri]!==-2;

 let hint="";if(st.hinted[ri]){const sh=byId[correct];hint='<div class="fb-box good" style="background:#FFF9E6;border-color:#F5C518">💡 '+U.hintPre[LANG]+" "+U.startWith[LANG]+' "'+t(sh.name).charAt(0)+'" — '+(sh.sides>0?(sh.sides+" "+U.sides[LANG].toLowerCase()):U.noStraight[LANG])+"</div>"}

 box.innerHTML='<div class="game-head"><span class="chip">🧩 '+U.riddleW[LANG]+": <b>"+(st.i+1)+"</b>/30</span>"
 +'<span class="chip">⭐ '+U.score[LANG]+": <b>"+st.score+"</b></span>"

 box.innerHTML='<div class="game-head" style="justify-content:center">'
 +'<span class="chip">🃏 '+U.moves[LANG]+": <b>"+st.moves+"</b></span>"

 st.flip.push(i);sfx("flip");

 +'</tbody></table></div><p class="tiny">'+U.recapTip[LANG]+"</p></div>"
 +'<div class="card"><h3>📚 '+U.vocab[LANG]+'</h3><div class="vocab">'+VOCAB.map((v,i)=>'<button class="vcard" data-v="'+i+'"><b>'+t(v)+'</b><span class="vdef">'+(LANG==="en"?v.den:v.di)+"</span></button>").join("")+"</div></div>"
 +'<div class="card"><h3>👪 '+U.quadClub[LANG]+'</h3><div class="ex-row">'+SHAPES.filter(s=>s.quad).map(s=>'<div class="ex" style="--sc:'+s.color+'"><span class="mini-svg" style="width:44px;height:44px">'+shapeSVG(s,{mini:1})+'</span><span class="ex-lab">'+t(s.name)+"</span></div>").join("")+'</div><p class="tiny" style="margin-top:8px">'+U.quadNote[LANG]+"</p></div>"}

/* ============ REFLECTION ============ */
function buildReflection(){const r=RS.ref;const done=r.ch.filter(Boolean).length;const pct=done/CHECKS.length*100;
 $("#reflWrap").innerHTML=
 '<div class="card"><h3>😊 '+U.moodQ[LANG]+'</h3><div class="mood-row">'+MOODS.map((m,i)=>'<button class="mood'+(r.mood===i?" sel":"")+'" data-m="'+i+'"><span>'+m.e+"</span><small>"+t(m)+"</small></button>").join("")+"</div>"+(r.mood!=null?'<p class="mood-msg">'+t(MOODS[r.mood].msg)+"</p>":"")+"</div>"
 +'<div class="card"><h3>✅ '+U.selfCheck[LANG]+'</h3><div class="checks">'+CHECKS.map((c,i)=>'<button class="check'+(r.ch[i]?" on":"")+'" data-c="'+i+'"><span class="cb">'+(r.ch[i]?"✅":"⬜")+"</span> "+t(c)+"</button>").join("")+'</div><div class="pbar-mini"><div style="width:'+pct+'%"></div></div><p class="tiny">'+(done===CHECKS.length?U.checkDone[LANG]:U.checkTip[LANG])+"</p></div>"
 +'<div class="card"><h3>💭 '+U.learnQ[LANG]+'</h3><textarea id="refText" rows="3" placeholder="'+U.learnPh[LANG]+'"></textarea><div class="btn-row" style="justify-content:flex-start"><button class="btn btn-p" id="refSave">'+U.save[LANG]+'</button><span id="refMsg" class="tiny">'+(r.saved?U.savedMsg[LANG]:"")+"</span></div></div>"
 +'<div class="card"><h3>🏅 '+U.report[LANG]+'</h3><div class="scores">'
 +'<span class="score-chip">🕵️ '+(RS.r?RS.r.score:0)+" / 30</span>"
 +'<span class="score-chip">📝 '+(RS.q?RS.q.score:0)+" / 10</span>"
 +'<span class="score-chip">🧠 '+(RS.m&&RS.m.best?RS.m.best.moves+" "+U.moves[LANG].toLowerCase()+" • "+RS.m.best.sec+"s":"—")+"</span>"
 +'</div><p class="tiny">'+U.reportTip[LANG]+"</p></div>";
 const ta=$("#refText");if(ta){ta.value=r.text;ta.addEventListener("input",()=>{r.text=ta.value})}
 const sv=$("#refSave");if(sv)sv.addEventListener("click",()=>{r.saved=true;store("g5_reflect",r.text);const m=$("#refMsg");if(m)m.textContent=U.savedMsg[LANG];sfx("ok")})}

/* ============ GLOBAL EVENT BINDINGS ============ */
function bindGlobal(){
 $("#riddleGame").addEventListener("click",e=>{
  const st=RS.r;if(!st)return;
  const opt=e.target.closest(".opt");if(opt&&opt.dataset.sid){answerRiddle(opt.dataset.sid);return}
  if(e.target.closest("#rHint")){const ri=st.order[st.i];if(st.ans[ri]!==-2)return;st.hinted[ri]=true;sfx("pop");renderRiddle();return}
  if(e.target.closest("#rSpeak")){const r=RIDDLES[st.order[st.i]];speak(t(r));return}
  if(e.target.closest("#rNext")){advRiddle();return}
  if(e.target.closest("#rAgain")){restartRiddle();return}
  if(e.target.closest("#rMenu")){go(2);return}});
 $("#quizGame").addEventListener("click",e=>{
  const st=RS.q;if(!st)return;
  const opt=e.target.closest(".opt");if(opt&&opt.dataset.oi!==undefined){answerQuiz(parseInt(opt.dataset.oi,10));return}
  if(e.target.closest("#qSpeak")){const q=QUIZ[st.order[st.i]];speak(t(q));return}
  if(e.target.closest("#qNext")){advQuiz();return}
  if(e.target.closest("#qAgain")){restartQuiz();return}
  if(e.target.closest("#qMenu")){go(2);return}});
 $("#memoryGame").addEventListener("click",e=>{
  if(e.target.closest("#mNew")){memNew();return}
  const card=e.target.closest(".mem-card");if(card)flipCard(parseInt(card.dataset.i,10))});
 $("#conclWrap").addEventListener("click",e=>{const v=e.target.closest(".vcard");if(v){v.classList.toggle("open");sfx("pop")}});
 $("#reflWrap").addEventListener("click",e=>{
  const mood=e.target.closest(".mood");if(mood){RS.ref.mood=parseInt(mood.dataset.m,10);sfx("pop");buildReflection();return}
  const chk=e.target.closest(".check");if(chk){const i=parseInt(chk.dataset.c,10);RS.ref.ch[i]=!RS.ref.ch[i];sfx("pop");buildReflection();if(RS.ref.ch.every(Boolean)){confetti(80);sfx("win")}return}});
 bindShapeHost();
 document.addEventListener("keydown",e=>{
  if(e.target&&(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"))return;
  if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")prev();else if(e.key==="Escape")closeMenu()});
 let tx=0,ty=0;
 document.addEventListener("touchstart",e=>{if(e.target.closest("button,input,textarea,svg,a")){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
 document.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;const dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0)next();else prev()}tx=null},{passive:true});
}

/* ============ INIT ============ */
function init(){
 const sv=load("g5_lang");if(sv==="id")LANG="id";
 if(load("g5_mute")==="1"){MUTED=true;const sb=$("#sndBtn");if(sb)sb.textContent="🔇"}
 newRiddleRun();newQuizRun();newMemRun();
 const savedText=load("g5_reflect");if(savedText)RS.ref.text=savedText;
 buildShapes();collectSlides();
 setLang(LANG);
 bindGlobal();
 go(0);
}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
